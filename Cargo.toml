[package]
name = "sshexplorer"
version = "0.1.0"
edition = "2024"

[dependencies]
# egui and eframe move together. eframe's defaults give the glow renderer, Wayland, X11
# and AccessKit on Linux, and the native backends on macOS and Windows.
egui = "0.37"
eframe = "0.37"
# The font reader egui itself uses: validates a font file before egui gets it.
skrifa = "=0.44.0"
# App settings: a TOML file in the platform config directory.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
directories = "6.0.0"
# The installed-font index behind "UI font" and "Monospace font".
fontdb = "0.24.0"

# The SSH stack (ADR-0002, issue #4): russh and its SFTP client, in process, on a tokio
# runtime of the app's own off the frame thread. Use russh's `keys::ssh_key` re-export,
# never `ssh-key` directly: russh pins an exact release candidate.
russh = "0.65.4"
russh-sftp = "4.0.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }
# Hashed known_hosts entries (`|1|salt|hash`): HMAC-SHA1 of the host name, base64.
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
# Source Preview: syntect's default syntaxes and themes with the pure-Rust regex engine
# (no oniguruma C library), used directly rather than through egui_extras (issue #33).
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# The native folder picker behind Settings → Preview → Scratch folder → Browse….
rfd = "0.18.0"
# Traditional encrypted PEM keys (DEK-Info AES-128/256-CBC, DES-EDE3-CBC), which russh
# reads only for AES-128 RSA. The versions russh itself uses.
md5 = "0.8.1"
aes = "0.9.4"
cbc = "0.2.1"
des = "0.9.0"
# The Modified column in the operator's time zone. russh-sftp already depends on it.
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Archive Preview: zip and tar listings, `.tar.gz` through flate2 (issue #37). A listing
# reads the zip central directory without decompressing, so zip needs no codecs.
zip = { version = "9.8.1", default-features = false }
tar = "0.4.46"
flate2 = "1.1.11"

# The OS reduced-motion read (theme/motion/system.rs), one platform each.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["UI_ViewManagement", "Foundation"] }

[dev-dependencies]
egui_kittest = "0.37"
# The test SSH/SFTP server (tests/common/fixture.rs) serves a temporary directory.
tempfile = "3.27"
# The test SSH agent (tests/auth.rs) is russh's agent server, which takes a Stream.
futures = "0.3.34"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
